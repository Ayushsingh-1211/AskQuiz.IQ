[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "askquiz-iq"
version = "0.1.0"
description = "Pause & Ask Learning Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "psycopg[binary,pool]>=3.1.18",
    "pgvector>=0.2.5",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytesseract>=0.3.10",
    "sentence-transformers>=2.5.0",
    "opencv-python-headless>=4.9.0",
    "pymupdf>=1.24.0",
    "python-pptx>=0.6.23",
    "yt-dlp>=2024.3.10",
    "faster-whisper>=1.0.0",
    "google-genai>=0.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "infra*"]

[tool.pytest.ini_options]
pythonpath = [".", "apps/api"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "conftest.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
