services:
  db:
    image: pgvector/pgvector:pg16
    container_name: askquiz-db
    restart: unless-stopped
    ports:
      - "5432:5432"
      - "5433:5432"
    environment:
      POSTGRES_USER: pause
      POSTGRES_PASSWORD: pause
      POSTGRES_DB: pause
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pause -d pause"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
