name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pause
          POSTGRES_PASSWORD: pause
          POSTGRES_DB: pause
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-hin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run preflight self-check
        env:
          DATABASE_URL: postgresql://pause:pause@localhost:5432/pause
          GEMINI_API_KEY: "dummy-ci-gemini-key"
          DATA_DIR: ./data
        run: |
          python infra/scripts/preflight.py

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://pause:pause@localhost:5432/pause
          GEMINI_API_KEY: "dummy-ci-gemini-key"
          DATA_DIR: ./data
        run: |
          pytest tests/conftest.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web frontend
        if: hashFiles('apps/web/package.json') != ''
        run: |
          cd apps/web
          npm ci || npm install
          npm run build || true
